name: Update MarketLens Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch raw data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python src/fetch_data.py

      - name: Clean and merge data
        run: |
          python src/clean_data.py

      - name: Build feature dataset
        run: |
          python src/analyze_data.py

      - name: Verify generated files
        run: |
          test -f data/processed/marketlens_dataset.csv
          test -f data/processed/marketlens_features.csv
          python -c "import pandas as pd; df=pd.read_csv('data/processed/marketlens_features.csv'); print(df.shape); print(df.tail(3))"

      - name: Commit updated processed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/marketlens_dataset.csv data/processed/marketlens_features.csv
          git diff --cached --quiet || git commit -m "Update processed MarketLens data"
          git push